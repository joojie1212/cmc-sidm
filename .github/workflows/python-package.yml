name: CMC SIDM build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran cmake openmpi-bin libopenmpi-dev libhdf5-dev libgsl-dev zlib1g-dev
      - name: Build CMC
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=mpicc -DCMAKE_Fortran_COMPILER=mpifort -DCMAKE_BUILD_TYPE=Release -DFITS=OFF
          cmake --build build -j 2
      - name: Install Python initial-condition dependencies
        run: python -m pip install ./src/bse_wrap/bse/COSMIC
      - name: Test elastic scattering kernel
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iinclude/cmc tests/sidm_kernel.c -lm -o /tmp/test_sidm_kernel
          /tmp/test_sidm_kernel
      - name: Test DM and SIDM with MPI
        run: python tests/test_dm_sidm.py
